<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Навигация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f5fb;
      --surface: #ffffff;
      --text: #111c2d;
      --muted: rgba(17,28,45,0.44);
      --blue: linear-gradient(110deg,
        #7ab4e8 0%,
        #2e6fba 20%,
        #5a9fd4 38%,
        #1a4f8a 55%,
        #4888c4 70%,
        #82b8ec 85%,
        #2e6fba 100%
      );
      --blue-glow: rgba(46,111,186,0.16);
      --blue-border: rgba(46,111,186,0.26);
      --blue-border-hover: rgba(46,111,186,0.72);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 640px; height: 440px;
      background: radial-gradient(ellipse, rgba(46,111,186,0.12) 0%, transparent 70%);
      top: -120px; right: -80px;
      filter: blur(100px);
      pointer-events: none;
      animation: drift 14s ease-in-out infinite alternate;
    }
    body::after {
      content: '';
      position: fixed;
      width: 520px; height: 380px;
      background: radial-gradient(ellipse, rgba(90,159,212,0.09) 0%, transparent 70%);
      bottom: -80px; left: -60px;
      filter: blur(120px);
      pointer-events: none;
      animation: drift 18s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(24px,16px); } }

    .wrapper {
      position: relative;
      z-index: 1;
      width: min(480px, 92vw);
      animation: fadeUp 0.8s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .rule {
      width: 48px; height: 2px;
      background: var(--blue);
      border-radius: 2px;
      margin-bottom: 20px;
    }

    .eyebrow {
      display: block;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: var(--blue);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
      color: var(--text);
    }

    .subtitle {
      font-size: 14px;
      font-weight: 300;
      color: var(--muted);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-item {
      opacity: 0;
      animation: slideIn 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .nav-item:nth-child(1) { animation-delay: 0.25s; }
    .nav-item:nth-child(2) { animation-delay: 0.40s; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .nav-link {
      display: flex;
      align-items: stretch;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 0 0 1.5px var(--blue-border),
                  0 1px 4px rgba(0,0,0,0.05);
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s;
    }

    .nav-link:hover {
      transform: translateX(5px);
      box-shadow: 0 0 0 1.5px var(--blue-border-hover),
                  0 8px 28px var(--blue-glow),
                  0 2px 10px rgba(0,0,0,0.06);
    }

    /* Cool blue specular shimmer */
    .nav-link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 20%,
        rgba(122,180,232,0.18) 38%,
        rgba(210,232,252,0.34) 50%,
        rgba(122,180,232,0.18) 62%,
        transparent 80%
      );
      transform: translateX(-130%);
      transition: transform 0.60s ease;
      pointer-events: none;
      z-index: 1;
    }
    .nav-link:hover::before { transform: translateX(130%); }

    /* Blue left accent bar */
    .nav-link::after {
      content: '';
      position: absolute;
      left: 0; top: 18%; bottom: 18%;
      width: 3.5px;
      background: var(--blue);
      border-radius: 0 3px 3px 0;
      transform: scaleY(0);
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
      transform-origin: center;
      z-index: 2;
    }
    .nav-link:hover::after { transform: scaleY(1); }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 22px 26px;
      position: relative;
      z-index: 2;
    }

    .link-text { display: flex; flex-direction: column; gap: 4px; }

    .link-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .link-desc {
      font-size: 12px;
      font-weight: 300;
      color: var(--muted);
    }

    /* Polished blue button */
    .link-arrow {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(145deg,
        #a8d0f0 0%,
        #3a80cc 28%,
        #1a508c 55%,
        #5898d4 78%,
        #c0daf4 100%
      );
      box-shadow:
        0 2px 10px rgba(30,80,160,0.30),
        inset 0 1.5px 2px rgba(255,255,255,0.65),
        inset 0 -1px 1.5px rgba(0,0,0,0.14);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s;
    }
    .nav-link:hover .link-arrow {
      transform: translateX(3px) rotate(45deg);
      box-shadow:
        0 4px 18px rgba(30,80,160,0.40),
        inset 0 1.5px 2px rgba(255,255,255,0.65),
        inset 0 -1px 1.5px rgba(0,0,0,0.14);
    }
    .link-arrow svg {
      stroke: rgba(255,255,255,0.92);
      filter: drop-shadow(0 0.5px 1px rgba(0,40,100,0.30));
    }

    /* Subtle psychology note */
    .note {
      margin-top: 32px;
      padding: 14px 18px;
      border-radius: 10px;
      background: rgba(46,111,186,0.06);
      border: 1px solid rgba(46,111,186,0.12);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      animation: fadeUp 0.8s 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    .note strong {
      color: #2e6fba;
      font-weight: 500;
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: rgba(17,28,45,0.22);
      letter-spacing: 0.05em;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <div class="rule"></div>
    <span class="eyebrow">Contents</span>
    <h1>Choose a page</h1>
    <p class="subtitle">Links to all available sections of the site</p>

    <ul class="nav-list">
      <li class="nav-item">
        <a href="HyperVResearchesHistory.html" class="nav-link">
          <div class="nav-inner">
            <div class="link-text">
              <span class="link-title">Hyper-V reseaches history list</span>
              <span class="link-desc">HyperVResearchesHistory.html</span>
            </div>
            <div class="link-arrow">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 7h9M7 2.5l4.5 4.5L7 11.5"/>
              </svg>
            </div>
          </div>
        </a>
      </li>
      <li class="nav-item">
        <a href="msdn_archive/msdn_archive.html" class="nav-link">
          <div class="nav-inner">
            <div class="link-text">
              <span class="link-title">MSDN archive with Hyper-V documentation</span>
              <span class="link-desc">msdn_archive.html</span>
            </div>
            <div class="link-arrow">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 7h9M7 2.5l4.5 4.5L7 11.5"/>
              </svg>
            </div>
          </div>
        </a>
      </li>
    </ul>
    <p class="footer">index.html</p>
  </main>
</body>
</html>
